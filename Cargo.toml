[workspace]
resolver = "2"

members = ["logger", "interner", "fs", "crockford", "input"]

[workspace.package]
version = "0.1.26"
edition = "2024"
license = "MPL-2.0"
homepage = "https://teamvulpine.com"
repository = "https://github.com/TeamVulpine/PawKit"

[workspace.dependencies]
pawkit-logger.path = "./logger"
pawkit-logger.version = "0.1.26"

pawkit-fs.path = "./fs"
pawkit-fs.version = "0.1.26"

pawkit-crockford.path = "./crockford"
pawkit-crockford.version = "0.1.26"

pawkit-input.path = "./input"
pawkit-input.version = "0.1.26"

pawkit-interner.path = "./interner"
pawkit-interner.version = "0.1.26"

num_enum = "0.7.6"
serde.version = "1.0.229"
serde.features = ["serde_derive"]
wasm-bindgen = "0.2.129"
futures-util = "0.3.34"
chrono = "0.4.45"
anyhow = "1.0.104"
zip = "9.1.3"
thiserror = "2.0.21"
dashmap = "6.2.1"
rand = "0.10.3"
bitvec = "1.1.1"

web-sys.version = "0.3.106"
web-sys.features = [
  "BinaryType",
  "Blob",
  "ErrorEvent",
  "FileReader",
  "MessageEvent",
  "ProgressEvent",
  "WebSocket",
  "IdbFactory",
  "IdbDatabase",
  "IdbTransaction",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbCursorWithValue",
  "Window",
  "Response",
]

[package]
name = "pawkit"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "PawKit is a mninimal game engine toolkit, written in Rust, with support for C, C++, Godot, and Lua."

[dependencies]
pawkit-logger.workspace = true
pawkit-input.workspace = true
pawkit-interner.workspace = true
pawkit-fs.workspace = true

pawkit-crockford.workspace = true
pawkit-crockford.optional = true

[features]
default = ["serde"]
internal_libraries = ["pawkit-crockford"]
serde = [
  "pawkit-input/serde",
  "pawkit-interner/serde",
  "pawkit-crockford?/serde",
]
